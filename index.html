<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Квартира · 3D-планувальник ремонту</title>
<style>
:root{
  --bg:#f6f4f0; --panel:rgba(250,249,246,.94); --line:rgba(40,36,30,.12); --ink:#23211e; --mute:#7b756c;
  --acc:#c95f38; --acc-soft:rgba(201,95,56,.12); --shadow:0 10px 34px rgba(30,22,12,.16),0 1px 3px rgba(30,22,12,.1);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#aab4c0;color:var(--ink);
  font:13.5px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.7);border-radius:var(--r);box-shadow:var(--shadow)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ico{display:inline-flex;align-items:center;justify-content:center}
h4{margin:16px 0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700}
h4:first-child{margin-top:2px}

/* верхня панель */
/* усе, що по центру, центрується у вільному місці праворуч від лівої панелі (--lw — де воно починається) */
.topbar{position:absolute;top:12px;left:calc((100vw + var(--lw,0px) - 12px) / 2);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 10px;max-width:calc(100vw - var(--lw,0px) - 12px);white-space:nowrap}
.topbar>*{flex:none}
/* рівні стискання верхньої панелі, коли вона не вміщається: класи tc1…tc6 накопичуються (виставляє ui._fitTop) */
.topbar.tc1 .brand span,.topbar.tc1 .acct-btn span:not(.ava){display:none}
.topbar.tc1 .time-w .time{width:96px}
.topbar.tc2 .seg-b:not(.on) span:not(.ico){display:none}
.topbar.tc3 .seg-b span:not(.ico){display:none}
.topbar.tc3 .seg-b{padding:6px 9px}
.topbar.tc4 .brand,.topbar.tc4 .time-l{display:none}
.topbar.tc5 .time-w,.topbar.tc5 .sep{display:none}
.topbar.tc6{overflow-x:auto;scrollbar-width:none}
.brand{display:flex;flex-direction:column;line-height:1.15;padding:0 8px 0 4px;white-space:nowrap}
.brand b{font-size:14px}.brand span{font-size:11px;color:var(--mute)}
.seg{display:inline-flex;background:rgba(40,36,30,.07);border-radius:10px;padding:3px;gap:2px}
.seg.wide{display:flex;margin:8px 0}.seg.wide .seg-b{flex:1;justify-content:center}
.seg-b{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-weight:600;color:#5d574e;white-space:nowrap}
.seg-b:hover{color:var(--ink)}
.seg-b.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg-b svg{width:17px;height:17px}
.tb{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#4f4a43;flex:none}
.tb:hover{background:rgba(40,36,30,.08);color:var(--ink)}
.tb.on{background:#ffe9a8;color:#8a5a00;box-shadow:inset 0 0 0 1px rgba(160,110,0,.25)}
.tb:disabled{opacity:.32;pointer-events:none}
.tb.sm{width:28px;height:28px}.tb.danger:hover{background:#fbe3dd;color:#b4311c}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.time-w{display:flex;align-items:center;gap:7px;padding:0 6px;color:#8a6a1e}
.time-w .time{width:130px;flex:none}.time-l{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);min-width:40px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(40,36,30,.16);outline:none;width:100%;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:pointer}

/* ліва панель */
.left{position:absolute;top:12px;left:12px;bottom:12px;width:368px;display:flex;overflow:hidden;transition:width .18s ease}
.left.closed{width:86px;bottom:auto}
.left.closed .panel-body{display:none}
.tabs{display:flex;flex-direction:column;gap:4px;padding:8px 6px;width:86px;flex:none;border-right:1px solid var(--line)}
.left.closed .tabs{border-right:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:10px;font-size:10.5px;font-weight:600;color:#6a645b}
.tab:hover{background:rgba(40,36,30,.06);color:var(--ink)}
.tab.on{background:var(--acc-soft);color:var(--acc)}
.panel-body{flex:1;min-width:0;overflow:auto;padding:12px 12px 20px;scrollbar-width:thin}
.search{width:100%;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;outline:none}
.search:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.chip{padding:4px 9px;border-radius:99px;background:rgba(40,36,30,.07);font-weight:600;font-size:12px;color:#5d574e;display:inline-flex;gap:5px;align-items:center}
.chip i{font-style:normal;font-weight:500;color:#9a948a;font-size:11px}
.chip:hover{background:rgba(40,36,30,.12)}
.chip.on{background:var(--acc);color:#fff}.chip.on i{color:rgba(255,255,255,.75)}
.note{color:var(--mute);font-size:12px;margin:6px 0 10px}
.muted{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px 8px;transition:transform .12s,box-shadow .12s,border-color .12s}
.card{user-select:none;-webkit-user-select:none;cursor:grab}
.ghost{position:fixed;left:0;top:0;width:84px;height:84px;object-fit:contain;pointer-events:none;z-index:300;opacity:.92;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));background:rgba(255,255,255,.85);border-radius:12px}
body.placing,body.placing *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,22,12,.14);border-color:var(--acc)}
.card .thumb{aspect-ratio:1.15;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f7f5f1,#ece8e1);border-radius:8px;margin-bottom:6px;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain}
.card span{font-weight:600;font-size:12.5px;line-height:1.25}
.card small{color:var(--mute);font-size:11px;margin-top:2px;min-height:15px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0}

/* ремонт */
.scope{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;margin:2px 0 8px}
.scope>span:first-child{font-weight:700}
.link{color:var(--acc);text-decoration:underline;padding:0;font-size:12px}
.curr{display:flex;gap:10px;align-items:center;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px}
.curr .sw{width:44px;height:44px;border-radius:9px}
.curr b{display:block}.curr small{color:var(--mute)}
.sw{display:block;width:100%;aspect-ratio:1;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);background-size:cover}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.swatches.paints{grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.swb{display:flex;flex-direction:column;gap:3px;padding:3px;border-radius:10px;text-align:center;min-width:0}
.swb span:last-child{font-size:10.5px;line-height:1.15;color:#5d574e;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.swb:hover{background:rgba(40,36,30,.07)}
.swb.on{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}
.swatches.paints .swb{padding:2px}.swatches.paints .sw{border-radius:50%}

/* контролі */
.ctl{margin:9px 0;display:flex;flex-direction:column;gap:4px}
.ctl>label,.lab label,.row2>label{font-weight:600;font-size:12.5px;color:#4f4a43}
.lab{display:flex;justify-content:space-between;align-items:baseline}
output{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px}
select{font:inherit;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;outline:none;max-width:100%}
select:focus{border-color:var(--acc)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:#4f4a43}
.check input{width:16px;height:16px;accent-color:var(--acc)}
.colors{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dot{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);padding:0}
.dot:hover{transform:scale(1.15)}
.dot.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
input[type=color]{width:26px;height:24px;border:1px solid var(--line);border-radius:7px;padding:1px;background:#fff;cursor:pointer}
.sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.row2{display:grid;grid-template-columns:104px 1fr 28px;gap:7px;align-items:center;margin:6px 0}
.fields.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.btn{padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:600;text-align:left}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger:hover{border-color:#b4311c;color:#b4311c}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}
.stylelist{display:flex;flex-direction:column;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--mute);font-weight:600;padding:4px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl .sum td{font-weight:700;border-bottom:0}

/* інспектор */
.right{position:absolute;top:70px;right:12px;width:292px;max-width:calc(100vw - var(--lw,0px) - 12px);max-height:calc(100vh - 130px);display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
.insp-head{display:flex;justify-content:space-between;gap:8px;padding:11px 10px 6px 14px}
.insp-head b{display:block;font-size:14.5px}.insp-head small{color:var(--mute);font-size:11.5px}
.tools{display:flex;gap:4px;padding:2px 10px 8px;border-bottom:1px solid var(--line)}
.insp-body{overflow:auto;padding:4px 14px 14px;scrollbar-width:thin}

/* підписи */
.labels{position:absolute;inset:0;overflow:hidden;pointer-events:none!important}
.rl,.dl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.rl{display:flex;flex-direction:column;align-items:center;padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.86);box-shadow:0 2px 8px rgba(0,0,0,.14);font-size:12px;line-height:1.2}
.rl span{color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.ml{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;padding:5px 11px;border-radius:9px;background:#1e6fd9;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);white-space:nowrap;line-height:1.25}
.ml b{font-size:14px}.ml span{font-size:11px;opacity:.9}
.il{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;font-size:10px;line-height:14px;font-weight:700;color:#12406f;background:rgba(255,255,255,.82);padding:0 3px;border-radius:3px;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px rgba(18,64,111,.18)}
.dl{font-size:11px;font-weight:700;color:#3c3832;background:rgba(255,255,255,.8);padding:0 4px;border-radius:4px;font-variant-numeric:tabular-nums}

.hint{position:absolute;left:calc((100vw + var(--lw,0px) - 12px) / 2);bottom:14px;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:rgba(28,26,23,.72);color:#fff;font-size:12.5px;width:max-content;max-width:min(880px,calc(100vw - var(--lw,0px) - 24px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;backdrop-filter:blur(8px);pointer-events:none!important}
.toast{position:absolute;left:calc((100vw + var(--lw,0px) - 12px) / 2);bottom:58px;transform:translate(-50%,12px);padding:8px 16px;border-radius:10px;background:#23211e;color:#fff;font-weight:600;opacity:0;transition:all .22s;pointer-events:none!important}
.toast.on{opacity:1;transform:translate(-50%,0)}

.modal{position:fixed;inset:0;background:rgba(20,16,10,.38);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-box{position:relative;max-width:620px;padding:22px 26px;margin:20px}
.modal-box h3{margin:0 0 10px;font-size:18px}
.modal-box ul{margin:0;padding-left:18px}.modal-box li{margin:7px 0}
.modal-box .x{position:absolute;top:10px;right:10px}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f1eee8;transition:opacity .5s}
#splash.gone{opacity:0;pointer-events:none}
#splash h1{margin:0;font-size:22px;font-weight:700}
#splash p{margin:0;color:var(--mute);max-width:520px;text-align:center}
#splash .bar{width:180px;height:4px;border-radius:4px;background:rgba(0,0,0,.1);overflow:hidden}
#splash .bar i{display:block;width:40%;height:100%;background:var(--acc);border-radius:4px;animation:ld 1.1s infinite ease-in-out}
#splash.err .bar{display:none}#splash.err p{color:#b4311c}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.btn.sm{padding:5px 9px;font-size:12px}
.dname{display:block;font-size:12.5px;margin:1px 0 6px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:7px;align-items:center}
.drow2{display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px;align-items:center;margin:6px 0}
.drow2>label{font-weight:600;font-size:12.5px;color:#4f4a43}
.stylegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sty{display:flex;flex-direction:column;gap:5px;padding:7px 8px;border-radius:10px;background:#fff;border:1px solid var(--line);text-align:left;font-weight:600;font-size:12px;line-height:1.2}
.sty{min-width:0}.sty>span:last-child{overflow-wrap:anywhere;min-width:0}
.sty:hover{border-color:var(--acc)}.sty.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft);color:var(--acc)}
.pal{display:flex;height:16px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pal i{flex:1}
.check.sm{font-size:12px;font-weight:500;margin:5px 0 3px}
.fields.box.door .btnrow{margin:6px 0 2px}
.doorsctl .btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.doorsctl .chips{margin:4px 0 0;align-items:center}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
/* акаунти, проєкти, оцінки */
.acct{position:relative;display:flex;align-items:center}.acct:empty{display:none}
.acct-btn{display:flex;align-items:center;gap:7px;padding:2px 9px 2px 2px;border-radius:99px;font-weight:600}
.acct-btn:hover{background:rgba(40,36,30,.08)}
.ava{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none;text-transform:uppercase}
.ava.lg{width:60px;height:60px;font-size:25px}.ava.xs{width:20px;height:20px;font-size:10.5px}
.menu{position:absolute;top:calc(100% + 12px);right:-6px;min-width:216px;padding:6px;display:flex;flex-direction:column;z-index:20}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-weight:600;text-align:left}
.menu button:hover{background:rgba(40,36,30,.07)}
.shot-w{position:relative;display:flex}
.menu .mi{display:flex;flex-direction:column;line-height:1.25}.menu .mi small{font-weight:500;color:var(--mute);font-size:11.5px}
.shot-w .menu{min-width:270px;right:-40px}
/* реалістичний рендер */
.render{position:fixed;inset:0;z-index:60;background:#191817;color:#efece6;display:flex;flex-direction:column}
.rd-top{display:flex;align-items:center;gap:14px;padding:10px 14px 8px 18px}.rd-top b{font-size:15px;flex:none}
.rd-top .tb{color:#d8d3ca}.rd-top .tb:hover{background:rgba(255,255,255,.12);color:#fff}
.rd-status{flex:1;min-width:0;color:#b9b3a8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-bar{height:3px;background:rgba(255,255,255,.1);flex:none}.rd-bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.rd-bar.done i{background:#5fbf78}
.rd-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
.rd-stage canvas{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#000}
.rd-wait{color:#8f897e;font-size:13px}
.rd-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px 14px;background:#22211f;border-top:1px solid rgba(255,255,255,.07)}
.rd-g{display:flex;align-items:center;gap:8px}.rd-g>span{color:#a8a297;font-size:12px}
.rd-g input[type=range]{width:120px;flex:none;background:rgba(255,255,255,.22);margin:0}.rd-g>b{min-width:28px;font-size:12.5px;font-weight:600}
.rd-ctl .seg{background:rgba(255,255,255,.08)}.rd-ctl .seg-b{color:#c9c3b8;padding:5px 10px}.rd-ctl .seg-b:hover{color:#fff}
.rd-ctl .seg-b.on{background:#f4f1ea;color:#1c1a17;box-shadow:none}
.rd-ctl select{background:rgba(255,255,255,.08);color:#efece6;border:1px solid transparent;border-radius:9px;padding:6px 8px;font:inherit;font-weight:600}
.rd-ctl select option{color:#1c1a17;background:#fff}
.rd-ctl .check{color:#d8d3ca;font-weight:500}.rd-sp{flex:1}
.render .btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border-color:transparent;color:#efece6;padding:6px 12px;flex:none}
.render .btn:hover{background:rgba(255,255,255,.16);color:#fff}.render .btn.on{background:var(--acc);color:#fff}
.render .btn:disabled{opacity:.4;pointer-events:none}.render .btn svg{width:17px;height:17px}
.rd-tip{color:#8f897e;font-size:12px;max-width:420px;text-align:right}
@media (max-width:1700px){.rd-tip{display:none}}
.brand.click{cursor:pointer;border-radius:9px;padding:3px 9px 3px 7px;max-width:230px}
.brand.click:hover{background:rgba(40,36,30,.07)}
.brand b,.brand span{overflow:hidden;text-overflow:ellipsis}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#3fa35b;vertical-align:1px}
.st-dot.dirty{background:#d9a21e}.st-dot.saving{background:#3c82d9;animation:pulse 1s infinite}.st-dot.error{background:#c93a2b}
@keyframes pulse{50%{opacity:.3}}
.banner{position:absolute;top:66px;left:calc((100vw + var(--lw,0px) - 12px) / 2);transform:translateX(-50%);display:flex;align-items:center;gap:11px;padding:6px 7px 6px 9px;max-width:calc(100vw - var(--lw,0px) - 12px);overflow:hidden;background:rgba(35,33,30,.9);color:#fff;border-color:rgba(255,255,255,.14);white-space:nowrap}
.banner>*{flex:none}.banner>span:not(.ava):not(.stars){flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.banner .btn{background:rgba(255,255,255,.13);border-color:transparent;color:#fff;padding:6px 11px}
.banner .btn:hover{background:rgba(255,255,255,.24);color:#fff;border-color:transparent}
.stars{display:inline-flex;gap:1px;vertical-align:middle;flex:none}
.star{padding:1px;color:#d3ccc0;line-height:0}.star.on{color:#f0a81c}
